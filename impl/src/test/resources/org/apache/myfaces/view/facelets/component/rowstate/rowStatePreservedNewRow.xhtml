<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<h:head></h:head>
<h:body>
    <h:form id="form">
        <h:dataTable id="table" value="#{rowStateNewRowBean.tableRows}" var="row" rowStatePreserved="true">
            <h:column>
                <h:panelGroup id="cell">
                    <f:event type="postAddToView" listener="#{rowStateNewRowBean.addInput}" />
                </h:panelGroup>
            </h:column>
        </h:dataTable>
        <ui:repeat id="repeat" value="#{rowStateNewRowBean.repeatRows}" var="row" rowStatePreserved="true">
            <h:panelGroup id="cell">
                <f:event type="postAddToView" listener="#{rowStateNewRowBean.addInput}" />
            </h:panelGroup>
        </ui:repeat>
        <h:commandButton id="submit" value="Submit" />
        <h:commandButton id="addRow" value="Add row" action="#{rowStateNewRowBean.addRow}">
            <f:ajax execute="@this" render="@form" />
        </h:commandButton>
    </h:form>
</h:body>
</html>
