<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<h:head></h:head>
<h:body>
    <h:form id="form">
        <h:inputText id="required" value="#{rowStateStaleBean.required}" required="true" immediate="true" />
        <h:dataTable id="table" value="#{rowStateStaleBean.tableRows}" var="row">
            <h:column><h:inputText id="in" value="#{row.name}" /></h:column>
        </h:dataTable>
        <ui:repeat id="repeat" value="#{rowStateStaleBean.repeatRows}" var="row">
            <h:inputText id="in" value="#{row.name}" />
        </ui:repeat>
        <h:commandButton id="submit" value="Submit" />
        <h:commandButton id="refresh" value="Refresh">
            <f:ajax execute="required" render="@form" />
        </h:commandButton>
    </h:form>
</h:body>
</html>
