<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html">
    <body>
        <h:form id="form">
            <h:inputText id="oneArg">
                <f:ajax event="change" listener="#{ajaxListenerBean.oneArg}" />
            </h:inputText>
            <h:inputText id="zeroArg">
                <f:ajax event="change" listener="#{ajaxListenerBean.zeroArg}" />
            </h:inputText>
            <h:inputText id="both">
                <f:ajax event="change" listener="#{ajaxListenerBean.both}" />
            </h:inputText>
            <h:inputText id="missing">
                <f:ajax event="change" listener="#{ajaxListenerBean.missing}" />
            </h:inputText>
        </h:form>
    </body>
</html>
